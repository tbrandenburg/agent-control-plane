services:
  control-plane:
    image: agent-control-plane:local
    build:
      context: .
      dockerfile: control-plane/Dockerfile
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      # Bootstrap (control-plane/src/bootstrap.js) clones per-session repo trees from *inside*
      # this container via plain node:fs/child_process — but `sandbox.js`'s `docker run -v` calls
      # go to the HOST docker daemon (via the socket above), so a clone path only visible inside
      # this container could never be bind-mounted into a spawned sandbox. Mounting the same
      # absolute host path at the identical path in both places keeps every path bootstrap
      # produces valid as a `docker run -v` source without any container/host path translation.
      - ${WORKSPACE_HOST_PATH:-${PWD}/workspace}:${WORKSPACE_HOST_PATH:-${PWD}/workspace}
    networks:
      - egress-net
    environment:
      DATA_DIR: /data
      # PHASE-4: sandboxes move to an `internal: true` `sandbox-net`; egress-net stays for the
      # control plane's own outbound traffic. See ARCHITECTURE.md §12.
      SANDBOX_IMAGE: agent-sandbox:local
      SANDBOX_NETWORK: egress-net
      WORKSPACE_HOST_PATH: ${WORKSPACE_HOST_PATH:-${PWD}/workspace}
      CONTROL_PLANE_URL: http://control-plane:3000
      # PHASE-2 (step 00602): no default gateway base URL/API key are injected here.
      # `OPENCODE_CONFIG_CONTENT` (control-plane/src/sandbox.js) composes only {model, autoupdate}
      # (ARCHITECTURE.md §8 Option C) — model resolution for any gateway-routed model id requires a
      # real Platform config repo's own provider block (step 00601), not a control-plane default.
      # `make e2e` instead defaults to `opencode/big-pickle`, a real, free, zero-credential model
      # bundled natively with opencode (e2e/tests/session-lifecycle.spec.ts) — see
      # docs/phase_01_findings.md's dated addendum for why the old `stub-model` fixture no longer
      # applies standalone.

  # Never started by `docker compose up` — sandboxes are spawned dynamically per session via
  # `docker run` (control-plane/src/sandbox.js), not as a long-running compose service. This
  # entry exists only so `docker compose build sandbox` (make sandbox-image) builds/tags the image.
  sandbox:
    image: agent-sandbox:local
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    profiles: ["build-only"]

networks:
  egress-net:
    name: egress-net
