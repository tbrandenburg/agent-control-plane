name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck:all

      - name: Lint
        run: pnpm exec biome check .

      - name: Unit + integration tests
        run: pnpm run test:all

      - name: Build dashboard
        run: pnpm run build:dashboard

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build control-plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: control-plane/Dockerfile
          tags: agent-control-plane:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Playwright browsers
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: E2E (real docker compose stack)
        run: make e2e SKIP_BUILD=1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: LOC budget gate
        run: pnpm run loc | tee "$GITHUB_STEP_SUMMARY"
