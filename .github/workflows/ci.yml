name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, high-signal checks — typecheck/lint/unit-tests/LOC gate cover the vast majority of
  # everyday mistakes and take well under a minute. Kept in its own job (not `needs`-chained to
  # `e2e`) so it reports pass/fail without waiting on Docker image builds or the E2E stack.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck:all

      - name: Lint
        run: pnpm exec biome check .

      - name: Build dashboard
        run: pnpm run build:dashboard

      - name: Unit + integration tests
        run: pnpm run test:all

      - name: LOC budget gate
        run: pnpm run loc | tee "$GITHUB_STEP_SUMMARY"

  # Docker image builds + real E2E stack — independent of `checks`, runs in parallel with it.
  # The control-plane and sandbox images and Playwright's browser install don't depend on each
  # other, so they're kicked off concurrently in one step instead of three sequential ones.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dashboard
        run: pnpm run build:dashboard

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images + install Playwright browsers (parallel)
        run: |
          set -e
          docker buildx build --load \
            -f control-plane/Dockerfile -t agent-control-plane:local \
            --cache-from type=gha,scope=control-plane-image \
            --cache-to type=gha,mode=max,scope=control-plane-image \
            . &
          build_cp=$!

          docker buildx build --load \
            -f sandbox/Dockerfile -t agent-sandbox:local \
            --cache-from type=gha,scope=sandbox-image \
            --cache-to type=gha,mode=max,scope=sandbox-image \
            . &
          build_sandbox=$!

          pnpm --filter e2e exec playwright install --with-deps chromium &
          playwright_install=$!

          fail=0
          wait "$build_cp" || fail=1
          wait "$build_sandbox" || fail=1
          wait "$playwright_install" || fail=1
          exit "$fail"

      - name: E2E (real docker compose stack)
        run: make e2e SKIP_BUILD=1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
